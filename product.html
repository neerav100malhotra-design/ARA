<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | ARA Silver Jewellery</title>
  <meta name="description" content="Explore everyday sterling silver jewellery from ARA.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="store-additions.css">
</head>
<body>
<header class="site-header"><div class="container nav">
  <a href="index.html" class="logo">ARA</a>
  <nav class="nav-links"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
  <button id="cartButton" class="cart-button" type="button">Bag (<span id="cartCount">0</span>)</button>
</div></header>
<main class="product-detail-page container">
  <p class="breadcrumbs"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span id="productBreadcrumb">Product</span></p>
  <div id="productDetail" class="product-detail-grid" aria-live="polite"><p>Loading product…</p></div>
  <section class="related-products"><h2>You may also like</h2><p>Discover more pieces in the <a href="shop.html">ARA collection</a>.</p></section>
</main>
<div id="cartOverlay" class="cart-overlay hidden"></div>
<aside id="cartPanel" class="cart-panel" aria-label="Shopping bag">
  <div class="cart-header"><h2>Your bag</h2><button id="closeCart" class="close-button" type="button" aria-label="Close cart">×</button></div>
  <div id="cartItems"></div><div id="emptyCart" class="empty-cart">Your bag is empty.</div>
  <div id="cartSummary" class="cart-summary hidden"><div class="summary-row"><span>Subtotal</span><strong id="cartSubtotal">₹0</strong></div><p class="cart-note">Shipping and payment will be confirmed at checkout.</p><button id="checkoutButton" class="button button-dark full-width" type="button">Checkout</button></div>
</aside>
<div id="toast" class="toast"></div>
<footer class="site-footer"><div class="container footer-inner"><span>ARA Silver Jewellery</span><span>Thoughtfully made for the everyday.</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="products.js"></script><script src="app.js"></script><script src="product-page.js"></script>
</body></html>
