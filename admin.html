
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f1">
  <title>ARA Admin — Product Manager</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="store-additions.css">

  <style>
    body.admin-page {
      background: var(--bg, #f7f5f1);
      color: var(--ink, #222);
    }

    .admin-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    .admin-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .admin-top h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
    }

    .admin-layout {
      display: grid;
      grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr);
      gap: 24px;
      align-items: start;
    }

    .admin-card {
      min-width: 0;
      background: #fff;
      border: 1px solid #e6e1d9;
      border-radius: 16px;
      padding: 22px;
    }

    .admin-form {
      display: grid;
      gap: 15px;
    }

    .admin-form label {
      display: grid;
      gap: 7px;
      font-size: 14px;
      font-weight: 500;
    }

    .admin-form input:not([type="checkbox"]),
    .admin-form select,
    .admin-form textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d8d3cb;
      border-radius: 9px;
      background: #fff;
      color: #222;
      font: inherit;
    }

    .admin-form input[type="file"] {
      padding: 10px;
    }

    .admin-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .admin-form input[type="checkbox"] {
      width: 18px;
      height: 18px;
      vertical-align: middle;
      margin-right: 7px;
    }

    .admin-form button,
    .admin-actions button {
      min-height: 42px;
      cursor: pointer;
    }

    .admin-form button:disabled,
    .admin-actions button:disabled {
      cursor: wait;
      opacity: .6;
    }

    .image-preview-wrap {
      display: grid;
      gap: 8px;
    }

    .image-preview {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
      background: #f2f0ec;
      border: 1px solid #e6e1d9;
    }

    .admin-note {
      color: #655e55;
      font-size: 13px;
      line-height: 1.6;
    }

    .admin-status {
      min-height: 22px;
      overflow-wrap: anywhere;
      color: #28633a;
      font-size: 14px;
      line-height: 1.5;
    }

    .admin-list {
      display: grid;
      gap: 12px;
    }

    .admin-product {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid #e8e4de;
      border-radius: 12px;
    }

    .admin-product img {
      width: 78px;
      height: 78px;
      object-fit: cover;
      border-radius: 8px;
      background: #f2f0ec;
    }

    .admin-product h3 {
      margin: 0 0 5px;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .admin-product p {
      margin: 4px 0;
      color: #666;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      grid-column: 1 / -1;
    }

    .admin-actions button {
      padding: 8px 12px;
      border: 1px solid #d6d1c8;
      border-radius: 8px;
      background: #fff;
    }

    .admin-actions .danger {
      color: #a32626;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 800px) {
      .admin-layout {
        grid-template-columns: 1fr;
      }

      .admin-card {
        padding: 17px;
      }
    }
  </style>
</head>

<body class="admin-page">
  <main class="admin-wrap">
    <header class="admin-top">
      <div>
        <p class="eyebrow">ARA Silver Jewellery</p>
        <h1>Product manager</h1>
      </div>

      <a class="button button-dark" href="index.html#shop">
        View storefront
      </a>
    </header>

    <section id="adminLogin" class="admin-card" hidden>
      <h2>ARA administrator login</h2>

      <form id="loginForm" class="admin-form">
        <label>
          Email
          <input
            name="email"
            type="email"
            autocomplete="username"
            required
          >
        </label>

        <label>
          Password
          <input
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>

        <button class="button button-dark" type="submit">
          Sign in
        </button>

        <p id="loginStatus" class="admin-status" aria-live="polite"></p>
      </form>
    </section>

    <div id="adminWorkspace" class="admin-layout" hidden>
      <section class="admin-card">
        <h2 id="formHeading">Add a product</h2>

        <form id="productForm" class="admin-form">
          <input type="hidden" name="id">

          <label>
            Product name
            <input name="name" required maxlength="120">
          </label>

          <label>
            Category
            <select name="category" required>
              <option value="rings">Rings</option>
              <option value="necklaces">Necklaces</option>
              <option value="earrings">Earrings</option>
              <option value="bracelets">Bracelets</option>
              <option value="anklets">Anklets</option>
            </select>
          </label>

          <label>
            Price (₹)
            <input
              name="price"
              type="number"
              min="1"
              step="1"
              required
            >
          </label>

          <div class="image-preview-wrap">
            <label for="imageFile">Product image</label>

            <input
              id="imageFile"
              name="imageFile"
              type="file"
              accept="image/jpeg,image/png,image/webp"
            >

            <img
              id="imagePreview"
              class="image-preview"
              alt="Selected product image preview"
              hidden
            >

            <p class="admin-note">
              Select a JPG, PNG or WebP image from your iPad.
              Maximum file size: 5 MB. Leave the file unselected
              when editing to keep the current image.
            </p>
          </div>

          <label>
            Or enter an existing image URL (optional)
            <input
              name="image"
              type="url"
              placeholder="https://example.com/image.jpg"
            >
          </label>

          <label>
            Description
            <textarea name="description" maxlength="500"></textarea>
          </label>

          <label>
            <span>
              <input name="active" type="checkbox" checked>
              Show product on storefront
            </span>
          </label>

          <button
            id="saveProduct"
            class="button button-dark"
            type="submit"
          >
            Save product
          </button>

          <button
            class="button"
            id="cancelEdit"
            type="button"
            hidden
          >
            Cancel edit
          </button>

          <p id="adminStatus" class="admin-status" aria-live="polite"></p>
        </form>
      </section>

      <section class="admin-card">
        <h2>Products <span id="productCount"></span></h2>
        <div id="adminProductList" class="admin-list"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
